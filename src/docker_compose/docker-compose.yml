services:
  server:
    image: chromadb/chroma
    container_name: tfg_chroma
    volumes:
      - chroma_data:/data
    ports:
      - "8000:8000"
    networks:
      - internal

  postgres:
    image: postgres:15-alpine
    container_name: tfg_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tfg_dataset
    ports:
      - "5432:5432"
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
networks:
  internal:

volumes:
  chroma_data:
  postgres_data: